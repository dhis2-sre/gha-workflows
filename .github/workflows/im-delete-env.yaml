name: Delete deployed environment

on:
  workflow_call:
    secrets:
      AWS_ACCESS_KEY_ID:
        required: true
        description: AWS Access Key Id
      AWS_SECRET_ACCESS_KEY:
        required: true
        description: AWS Secret Access Key
      KUBECONFIG:
        required: true
        description: Kubernetes Configuration
      IM_VM_DEV_HOST:
        required: false
        description: The im-vm dev and feature server, if this repository deploys there
      IM_VM_DEV_DEPLOY_KEY:
        required: false
        description: Its deploy key, which may destroy feature environments and nothing else

jobs:
  delete-env:
    runs-on: ubuntu-24.04
    if: github.actor != 'dependabot[bot]'
    steps:
      - uses: actions/checkout@v6

      - name: "Environment: feature"
        run: |
          # convert to lower case
          HEAD_BRANCH_LOWERCASE=${GITHUB_HEAD_REF,,}

          # substitute all non-alphanumeric chars with hyphens "-"
          HEAD_BRANCH_LOWERCASE_NO_NONALPHANUMERIC=${HEAD_BRANCH_LOWERCASE//[^[:alnum:]]/-}

          # trim to 25 chars, in order to fit into the 53 char Helm release name limit
          # the rest of the chars up to the limit are saved for the static part of the release names
          SANITIZED_HEAD_BRANCH=${HEAD_BRANCH_LOWERCASE_NO_NONALPHANUMERIC::25}

          echo "ENVIRONMENT=$SANITIZED_HEAD_BRANCH" >> $GITHUB_ENV
          echo "CLASSIFICATION=feature" >> $GITHUB_ENV

      - name: Setup aws-iam-authenticator
        uses: prepor/action-aws-iam-authenticator@master

      - name: Check aws-iam-authenticator version
        run: aws-iam-authenticator version

      - name: Configure kubectl
        run: |
          mkdir $PWD/.kube
          echo "${{ secrets.KUBECONFIG }}" > $PWD/.kube/config
          echo "KUBECONFIG=$PWD/.kube/config" >> $GITHUB_ENV

      - name: Setup Sops
        uses: mdgreenwald/mozilla-sops-action@v2.1.1

      - name: Setup helm secrets plugin
        run: helm plugin install https://github.com/jkroepke/helm-secrets --version v4.6.5

      - name: Setup Skaffold
        run: |
          wget https://storage.googleapis.com/skaffold/releases/${VERSION}/${BINARY} -O ./skaffold
          chmod +x ./skaffold
        env:
          VERSION: v2.6.0
          BINARY: skaffold-linux-amd64

      - name: Delete environment
        run: |
          SKAFFOLD_PROFILE=$([ "$CLASSIFICATION" == "feature" ] && echo "dev" || echo "$CLASSIFICATION")

          ./skaffold delete --profile $SKAFFOLD_PROFILE
        env:
          KUBECONFIG: ${{ env.KUBECONFIG }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

  # The same teardown on the Hetzner control plane. A separate job because it is a different system
  # with a different credential, and it runs whether or not the one above did: a feature environment
  # left behind holds a database, a Redis and a RabbitMQ on a box shared with dev.
  delete-im-vm-env:
    name: Delete the im-vm feature environment
    runs-on: ubuntu-24.04
    # A closed pull request has no environment either way, but unlabeled fires for every label, and
    # only this one created anything.
    if: >-
      github.actor != 'dependabot[bot]' &&
      (github.event.action == 'closed' || github.event.label.name == 'deploy')
    steps:
      - name: Destroy
        env:
          DEPLOY_KEY: ${{ secrets.IM_VM_DEV_DEPLOY_KEY }}
          HOST: ${{ secrets.IM_VM_DEV_HOST }}
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -o errexit -o nounset -o pipefail

          if [ -z "$HOST" ]; then
            echo "no im-vm server configured for this repository, nothing to tear down"
            exit 0
          fi

          # Has to match im-deploy-im-vm.yaml exactly, or this tears down nothing and leaves the
          # environment running: lowercase, non-alphanumerics to hyphens, 25 characters, no trailing
          # hyphen.
          lowercase=$(printf '%s' "$HEAD_BRANCH" | tr '[:upper:]' '[:lower:]')
          label=${lowercase//[^[:alnum:]]/-}
          label=${label::25}
          label=${label%-}

          install --mode=600 /dev/null deploy-key
          printf '%s\n' "$DEPLOY_KEY" > deploy-key
          ssh -i deploy-key -o StrictHostKeyChecking=accept-new -o BatchMode=yes \
            im@"$HOST" "down feat-$label"

      - name: Forget the key
        if: always()
        run: rm --force deploy-key
